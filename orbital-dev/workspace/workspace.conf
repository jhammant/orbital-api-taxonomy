file {
  changeDetectionMethod=WATCH
  incrementVersionOnChange=false
  projects=[
    {
      isEditable=true
      path="/opt/service/workspace"
    }
  ]
  pollFrequency=PT5S
  recompilationFrequencyMillis=PT3S
}
git {
  checkoutRoot="/opt/service/workspace/projects"
  pollFrequency=PT30S
  repositories=[]
}
